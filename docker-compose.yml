# =============================================================================
# Docker Compose configuration for Movie Rating Prediction API
# DDM501 - Lab 1: First ML Product
#
# Usage:
#   docker compose up -d --build
#   curl http://localhost:8000/health
#   docker compose down
# =============================================================================

services:
  api:
    build: .
    image: ddm501-lab1-api:latest
    container_name: ddm501-lab1-api
    ports:
      - "8000:8000"
    volumes:
      # Read-only: the API loads the model, it never writes one. Mounting it
      # keeps a retrained model usable without rebuilding the image.
      - ./models:/app/models:ro
    environment:
      - MODEL_PATH=/app/models/svd_model.pkl
      - MODEL_VERSION=1.0.0
    restart: unless-stopped
    # The healthcheck itself is defined in the Dockerfile and inherited here.
    # `docker compose ps` shows the resulting status.

# =============================================================================
# BONUS: additional services can be added here (e.g. redis for caching,
# prometheus for metrics) - not required for this lab.
# =============================================================================
