[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

# Only the one warning we cannot fix is silenced: scikit-surprise 1.1.3 imports
# pkg_resources at import time (see the setuptools<81 pin in requirements.txt).
# Everything else stays visible so real deprecations are not hidden.
filterwarnings =
    ignore:pkg_resources is deprecated as an API.*:UserWarning
